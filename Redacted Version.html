<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" type="image/png" sizes="192x192"
      href="AppFiles/Logos/GameLogo-192px.png">

<link rel="icon" type="image/png" sizes="512x512"
      href="AppFiles/Logos/GameLogo-512px.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Play Game</title>
  
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="/AppFiles/manifest.json">
  
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #111116;
    --card: #16161e;
    --border: #1e1e2a;
    --pink: rgb(255, 45, 120);
    --pink-dim: rgba(255, 45, 120, 0.15);
    --pink-glow: rgba(255, 45, 120, 0.35);
    --text: #e8e8f0;
    --muted: #5a5a72;
    --accent: #ff2d78;
    --pin-color: #ffd166;
    --pin-dim: rgba(255, 209, 102, 0.15);
    --pin-glow: rgba(255, 209, 102, 0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,45,120,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,45,120,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.3s;
  }

  body.discretion { background: #000; color: #555; }
  body.discretion::before { opacity: 0; }
  body.discretion header { display: none; }
  body.discretion .filters, body.discretion .controls-row { filter: grayscale(1); opacity: 0.5; }
  body.discretion .select-trigger, body.discretion .dropdown-panel, body.discretion .count-btn, body.discretion .btn-discretion {
    background: #111 !important; border-color: #222 !important; color: #444 !important; box-shadow: none !important; text-shadow: none !important;
  }
  body.discretion .select-trigger:hover, body.discretion .count-btn:hover, body.discretion .count-btn.active { border-color: #333 !important; color: #666 !important; background: #181818 !important; }
  body.discretion .arrow { color: #333 !important; }
  body.discretion .card { background: #0d0d0d !important; border-color: #1a1a1a !important; box-shadow: none !important; }
  body.discretion .card::before { opacity: 0; }
  body.discretion .card-text { color: #444 !important; }
  body.discretion .tag { display: none !important; }
  body.discretion .pin-btn { opacity: 0.15 !important; }
  body.discretion .btn-more { background: #1a1a1a !important; color: #333 !important; box-shadow: none !important; filter: none !important; text-shadow: none !important; }
  body.discretion .btn-more:hover { background: #222 !important; filter: none !important; box-shadow: none !important; }
  body.discretion .empty-state { color: #333 !important; }
  body.discretion .empty-icon { opacity: 0.2; }
  body.discretion .btn-discretion { color: #333 !important; border-color: #222 !important; }
  body.discretion .btn-discretion.active { background: #111 !important; color: #333 !important; }

  .wrapper {
    position: relative; z-index: 1; display: flex; flex-direction: column;
    min-height: 100dvh; padding: 24px 20px 32px; gap: 20px;
    max-width: 480px; margin: 0 auto; width: 100%;
  }
  header {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border); text-align: center;
  }
  header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 0.12em; color: var(--pink); line-height: 1; text-shadow: 0 0 30px var(--pink-glow); }
  header span { font-size: 0.6rem; letter-spacing: 0.25em; color: var(--muted); text-transform: uppercase; }
  .filters { display: flex; flex-direction: column; gap: 10px; }
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  .filter-label { font-size: 0.55rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
  .custom-select { position: relative; }
  .select-trigger {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 14px; font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text);
    cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    transition: border-color 0.2s; user-select: none;
  }
  .select-trigger:hover, .select-trigger.open { border-color: var(--pink); }
  .select-trigger .arrow { color: var(--pink); font-size: 0.6rem; transition: transform 0.2s; flex-shrink: 0; }
  .select-trigger.open .arrow { transform: rotate(180deg); }
  .select-trigger .preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .dropdown-panel { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--card); border: 1px solid var(--pink); border-radius: 6px; overflow: hidden; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px var(--pink-glow); }
  .dropdown-panel.open { display: block; }

  /* Select All / Deselect All row */
  .dropdown-ctrl {
    display: flex; gap: 0; border-bottom: 1px solid var(--border);
  }
  .dropdown-ctrl-btn {
    flex: 1; padding: 8px 10px; font-family: 'DM Mono', monospace; font-size: 0.55rem;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
    background: transparent; border: none; cursor: pointer;
    transition: color 0.15s, background 0.15s;
    text-align: center;
  }
  .dropdown-ctrl-btn:first-child { border-right: 1px solid var(--border); }
  .dropdown-ctrl-btn:hover { color: var(--pink); background: var(--pink-dim); }

  .dropdown-option { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text); transition: background 0.15s; border-bottom: 1px solid var(--border); }
  .dropdown-option:last-child { border-bottom: none; }
  .dropdown-option:hover { background: var(--pink-dim); }
  .dropdown-option.selected { color: var(--pink); }
  .checkbox { width: 14px; height: 14px; border: 1px solid var(--muted); border-radius: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; transition: all 0.15s; }
  .dropdown-option.selected .checkbox { background: var(--pink); border-color: var(--pink); color: white; }

  /* Count badge in dropdown */
  .option-count {
    margin-left: auto;
    font-size: 0.55rem;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 6px;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }
  .dropdown-option.selected .option-count {
    color: var(--pink);
    border-color: color-mix(in srgb, var(--pink) 30%, transparent);
    background: var(--pink-dim);
  }

  .controls-row { display: flex; align-items: flex-end; gap: 10px; }
  .count-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .count-btns { display: flex; gap: 6px; }
  .count-btn { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 9px 4px; font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); cursor: pointer; text-align: center; transition: all 0.15s; user-select: none; }
  .count-btn:hover { border-color: var(--pink); color: var(--text); }
  .count-btn.active { background: var(--pink-dim); border-color: var(--pink); color: var(--pink); }

  .btn-discretion { background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 10.5px 12px; font-family: 'DM Mono', monospace; font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); cursor: pointer; transition: all 0.2s; white-space: nowrap; align-self: auto; display: flex; align-items: center; gap: 6px; }
  .btn-discretion:hover { border-color: var(--muted); color: var(--text); }
  .btn-discretion.active { background: rgba(255,255,255,0.05); border-color: var(--muted); color: var(--text); }
  .btn-discretion .disc-icon { font-size: 0.75rem; line-height: 1; }

  .cards-area { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 180px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; position: relative; overflow: hidden;
    animation: slideIn 0.3s ease forwards; opacity: 0; transform: translateY(10px);
    transition: background 0.3s, border-color 0.3s;
    cursor: pointer;
  }
  .card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--cat, var(--pink)); box-shadow: 0 0 12px var(--cat-glow, var(--pink-glow));
    transition: opacity 0.3s;
  }
  .card.pinned {
    border-color: var(--pin-color);
    box-shadow: 0 0 0 1px var(--pin-dim), inset 0 0 20px rgba(255,209,102,0.03);
  }
  .card.pinned::before {
    background: var(--pin-color);
    box-shadow: 0 0 12px var(--pin-glow);
  }
  .card:hover { border-color: color-mix(in srgb, var(--cat, var(--pink)) 40%, var(--border)); }
  .card.pinned:hover { border-color: var(--pin-color); }

  @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes pinPop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

  .card-meta { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 0.5rem; letter-spacing: 0.2em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; font-weight: 500; }

  .cat-affirmation { --cat: rgb(67, 254, 42); --cat-dim: rgba(67, 254, 42, 0.15); --cat-glow: rgba(67, 254, 42, 0.35); }
  .cat-behaviour { --cat: rgb(44, 142, 254); --cat-dim: rgb(44, 142, 254, 0.15); --cat-glow: rgb(44, 142, 254, 0.35); }
  .cat-exercise { --cat: rgb(224, 224, 224); --cat-dim: rgba(224, 224, 224, 0.15); --cat-glow: rgba(224, 224, 224, 0.35); }
  .cat-gambit { --cat: rgb(255, 122, 61); --cat-dim: rgba(255, 122, 61, 0.15); --cat-glow: rgba(255, 122, 61, 0.35); }
  .cat-game { --cat: rgb(255, 95, 95); --cat-dim: rgba(255, 95, 95, 0.15); --cat-glow: rgba(255, 95, 95, 0.35); }
  .cat-joke { --cat: rgb(144, 255, 80); --cat-dim: rgba(144, 255, 80, 0.15); --cat-glow: rgba(144, 255, 80, 0.35); }
  .cat-nlp { --cat: rgb(0, 0, 0); --cat-dim: rgba(179, 179, 179, 0.76); --cat-glow: rgba(144, 255, 80, 0.35); }
  .cat-opener { --cat: rgb(255, 186, 59); --cat-dim: rgba(144, 255, 80, 0.15); --cat-glow: rgba(144, 255, 80, 0.35); }
  .cat-question { --cat: rgb(157, 130, 255); --cat-dim: rgba(157, 130, 255, 0.15); --cat-glow: rgba(157, 130, 255, 0.35); }
  .cat-phrase { --cat: rgb(252, 255, 57); --cat-dim: rgba(252, 255, 57, 0.15); --cat-glow: rgba(252, 255, 57, 0.35); }
  .cat-pre-game { --cat: rgb(196, 255, 57); --cat-dim: rgba(196, 255, 57, 0.15); --cat-glow: rgba(196, 255, 57, 0.35); }
  .cat-prop { --cat: rgb(59, 193, 255); --cat-dim: rgba(59, 193, 255, 0.15); --cat-glow: rgba(59, 193, 255, 0.35); }
  .cat-reply { --cat: rgb(139, 113, 255); --cat-dim: rgba(139, 113, 255, 0.15); --cat-glow: rgba(139, 113, 255, 0.35); }
  .cat-seduction { --cat: rgb(182, 57, 255); --cat-dim: rgba(182, 57, 255, 0.15); --cat-glow: rgba(182, 57, 255, 0.35); }
  .cat-situational { --cat: rgba(122, 59, 255, 1.00); --cat-dim: rgba(122, 59, 255, 0.15); --cat-glow: rgba(122, 59, 255, 0.35); }
  .cat-story { --cat: rgb(63, 255, 165); --cat-dim: rgba(63, 255, 165, 0.15); --cat-glow: rgba(63, 255, 165, 0.35); }
  .cat-statmaxing { --cat: rgba(255, 64, 144, 1.00); --cat-dim: rgba(255, 64, 144, 0.15); --cat-glow: rgba(255, 64, 144, 0.35); }
  .cat-truism { --cat: rgb(207, 207, 207); --cat-dim: rgba(207, 207, 207, 0.15); --cat-glow: rgba(207, 207, 207, 0.35); }
  .tag-category { background: var(--cat-dim); color: var(--cat); border: 1px solid color-mix(in srgb, var(--cat) 30%, transparent); }
  .tag-setting { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid var(--border); }

  .pin-btn {
    margin-left: auto;
    background: none; border: none; cursor: pointer;
    font-size: 0.85rem; line-height: 1; padding: 2px 4px;
    opacity: 0.25; transition: opacity 0.2s, transform 0.15s;
    color: var(--pin-color);
    flex-shrink: 0;
  }
  .pin-btn:hover { opacity: 0.7; }
  .card.pinned .pin-btn { opacity: 1; }
  .pin-btn.pop { animation: pinPop 0.3s ease; }

  .pin-hint {
    font-size: 0.5rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--pin-color); opacity: 0.7; margin-left: 2px;
  }

  .card-text { font-size: 0.85rem; line-height: 1.55; color: var(--text); font-weight: 300; transition: color 0.3s; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); text-align: center; padding: 40px 0; }
  .empty-icon { font-size: 2rem; opacity: 0.4; }
  .empty-state p { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; }

  .btn-more { background: var(--pink); color: white; border: none; border-radius: 8px; padding: 18px; font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 0.25em; cursor: pointer; width: 100%; transition: all 0.15s; box-shadow: 0 4px 24px var(--pink-glow); position: relative; overflow: hidden; }
  .btn-more::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%); pointer-events: none; }
  .btn-more:active { transform: scale(0.97); box-shadow: 0 2px 12px var(--pink-glow); }
  .btn-more:hover  { box-shadow: 0 6px 32px var(--pink-glow); filter: brightness(1.1); }
  .btn-more.pulse  { animation: btnPulse 0.3s ease; }
  @keyframes btnPulse { 0% { transform: scale(1); } 50% { transform: scale(0.96); } 100% { transform: scale(1); } }

/* ── Spice ─────────────────────────────────── */
.spice-filter { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
.spice-range-labels { display: flex; justify-content: space-between; font-size: 0.5rem; color: var(--muted); margin-bottom: 10px; letter-spacing: 0.1em; }
.spice-slider-row { position: relative; height: 28px; display: flex; align-items: center; }
.spice-track { position: absolute; left: 0; right: 0; height: 4px; background: var(--border); border-radius: 2px; pointer-events: none; }
.spice-fill  { position: absolute; height: 4px; border-radius: 2px; pointer-events: none; }
.spice-range-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.65rem; color: var(--muted); }
.spice-range-row span { color: var(--text); font-weight: 500; }
input[type=range].spice-thumb { -webkit-appearance: none; appearance: none; position: absolute; width: 100%; height: 4px; background: transparent; pointer-events: none; outline: none; }
input[type=range].spice-thumb::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--text); border: 2px solid var(--pink); pointer-events: all; cursor: pointer; }
input[type=range].spice-thumb::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; background: var(--text); border: 2px solid var(--pink); pointer-events: all; cursor: pointer; }
.tag-spice { font-size: 0.5rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 9px; border-radius: 3px; font-weight: 500; }

body.discretion .spice-filter { filter: grayscale(1); opacity: 0.5; }
body.discretion .tag-spice { filter: grayscale(1); opacity: 0.4; }

/* ── Search bar ───────────────────────────── */
.search-wrap {
  position: relative; display: flex; align-items: center;
}
.search-input {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 36px 10px 14px;
  font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text);
  outline: none; transition: border-color 0.2s;
  -webkit-appearance: none; appearance: none;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus, .search-input:not(:placeholder-shown) { border-color: var(--pink); }
.search-clear {
  position: absolute; right: 10px; background: none; border: none;
  color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1;
  padding: 4px; display: none; transition: color 0.15s;
}
.search-clear:hover { color: var(--text); }
.search-clear.visible { display: block; }
body.discretion .search-input { background: #111 !important; border-color: #222 !important; color: #444 !important; }
body.discretion .search-clear { color: #333 !important; }

/* Secondary full-width button - fits content width, not as bold as .btn-more */
.btn-action {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 20px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    width: 100%;
    cursor: pointer;
    transition: all 0.2s;
    margin: 8px 0 20px 0;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
}

.btn-action:hover {
    border-color: var(--pink);
    color: var(--pink);
    background: var(--pink-dim);
    transform: translateY(-1px);
}

.btn-action:active {
    transform: scale(0.98);
}

/* ── Discretion Mode Styling for the new button ── */
body.discretion .btn-action {
    background: #111 !important;
    border-color: #222 !important;
    color: #444 !important;
    box-shadow: none !important;
    text-shadow: none !important;
}

body.discretion .btn-action:hover {
    border-color: #333 !important;
    color: #666 !important;
    background: #181818 !important;
    transform: none;
}

body.discretion .btn-action:active {
    transform: scale(0.98);
}

    /* ── Spin dice icon ── */
    @keyframes spin { 
      from { transform: rotate(0deg); } 
      to { transform: rotate(360deg); } }
    .spinning { animation: spin 0.2s ease; }

</style>
</head>
<body>
<div class="wrapper">
  <header>
    <h1>PLAY GAME</h1>
    <span id="subheader">- tips &amp; gambits -</span>
  </header>

  <div class="search-wrap">
  <input
    class="search-input"
    id="searchInput"
    type="search"
    placeholder="Search cards…"
    autocomplete="off"
    spellcheck="false"
  >
  <button class="search-clear" id="searchClear" aria-label="Clear search">&#x2715;</button>
</div>

  <button class="btn-more" id="moreBtn"> 
    <svg class="icon" id="diceIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="4"/>
          <circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="16" cy="8" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="8" cy="16" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        MORE</button>

  <div class="cards-area" id="cardsArea">
    <div class="empty-state">
      <div class="empty-icon">&#9672;</div>
      <p>Hit MORE to deal your cards</p>
    </div>
  </div>

  <div class="filter-group">
  <div class="filter-label">Spice</div>
  <div class="spice-filter">
    <div class="spice-range-labels">
      <span>&#8722;5 negative</span>
      <span>0 neutral</span>
      <span>+5 spicy</span>
    </div>
    <div class="spice-slider-row">
      <div class="spice-track"></div>
      <div class="spice-fill" id="spiceFill"></div>
      <input type="range" class="spice-thumb" id="spiceMin" min="-5" max="5" step="1" value="-5">
      <input type="range" class="spice-thumb" id="spiceMax" min="-5" max="5" step="1" value="5">
    </div>
    <div class="spice-range-row">
      From <span id="spiceMinLabel">&#8722;5</span>&nbsp;&nbsp;to&nbsp;&nbsp;<span id="spiceMaxLabel">+5</span>
    </div>
  </div>
</div>

  <div class="filters">
    <div class="filter-group">
      <div class="filter-label">Category</div>
      <div class="custom-select" id="catSelect">
        <div class="select-trigger" id="catTrigger">
          <span class="preview" id="catPreview">All categories</span>
          <span class="arrow">&#9660;</span>
        </div>
        <div class="dropdown-panel" id="catPanel"></div>
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-label">Setting</div>
      <div class="custom-select" id="setSelect">
        <div class="select-trigger" id="setTrigger">
          <span class="preview" id="setPreview">All settings</span>
          <span class="arrow">&#9660;</span>
        </div>
        <div class="dropdown-panel" id="setPanel"></div>
      </div>
    </div>
  </div>

  <div class="controls-row">
    <div class="count-group">
      <div class="filter-label">Cards</div>
      <div class="count-btns" id="countBtns">
        <button class="count-btn"        data-count="1">1</button>
        <button class="count-btn active" data-count="3">3</button>
        <button class="count-btn"        data-count="5">5</button>
        <button class="count-btn"        data-count="9">9</button>
        <button class="count-btn"        data-count="all">All</button>
      </div>
    </div>
    <button class="btn-discretion" id="discretionBtn">
      <span class="disc-icon">&#9673;</span>
      <span>Discretion</span>
    </button>
  </div>
  <button class="btn-action" onclick="openExternalLink('https://github.com/kay-who-codes/The-Openator')">
    Open The Openator
  </button>
</div>
<script src="AppFiles/redactedData.js"></script>
<script>
// ── App state ─────────────────────────────────────────────
// DATA is declared by AppFiles/redactedData.js
//s as: const DATA = [ ... ];
let allCategories = [];
let allSettings   = [];
let catCounts     = {};
let setCounts     = {};
let selectedCats  = new Set();
let selectedSets  = new Set();
let cardCount     = 3;
let discretion    = false;
let pinnedItems   = [];
let spiceLo       = -5;
let spiceHi       = 5;
let searchMode    = false;
let openDropdown  = null;

const clickAudio = new Audio('/AppFiles/click.mp3');
clickAudio.preload = 'auto';

// ── Kick off immediately — data.js is already loaded ─────
init();

// ── Initialise everything once data is ready ─────────────
function init() {
  allCategories = [...new Set(DATA.map(d => d.category))].sort();
  allSettings   = [...new Set(DATA.map(d => d.setting))].sort();

  allCategories.forEach(c => { catCounts[c] = DATA.filter(d => d.category === c).length; });
  allSettings.forEach(s =>   { setCounts[s]  = DATA.filter(d => d.setting   === s).length; });

  selectedCats = new Set(allCategories);
  selectedSets = new Set(allSettings);

  // Update subheader with total count
  document.getElementById('subheader').textContent =
    '- ' + DATA.length + ' Tips & Gambits -';

  // Show "Hit MORE" prompt now that data is loaded
  document.getElementById('cardsArea').innerHTML =
    '<div class="empty-state"><div class="empty-icon">&#9672;</div><p>Hit MORE to deal your cards</p></div>';

  // Build dropdowns
  buildDropdown('catPanel', allCategories, selectedCats, 'catPreview', catCounts);
  buildDropdown('setPanel', allSettings,   selectedSets, 'setPreview', null);
  setupTrigger('cat');
  setupTrigger('set');

  // Bind count buttons
  document.getElementById('countBtns').addEventListener('click', (e) => {
    const btn = e.target.closest('.count-btn');
    if (!btn) return;
    cardCount = btn.dataset.count === 'all' ? Infinity : parseInt(btn.dataset.count, 10);
    document.querySelectorAll('.count-btn').forEach(b => b.classList.toggle('active', b === btn));
  });

  // Bind discretion button
  const discretionBtn = document.getElementById('discretionBtn');
  discretionBtn.addEventListener('click', () => {
    discretion = !discretion;
    document.body.classList.toggle('discretion', discretion);
    discretionBtn.classList.toggle('active', discretion);
  });

  // Bind MORE button
  document.getElementById('moreBtn').addEventListener('click', () => {
    closeAllDropdowns();
    searchMode = false;
    clickAudio.currentTime = 0;
    clickAudio.play().catch(() => {});
    const btn = document.getElementById('moreBtn');
    btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse');
    renderCards(shuffle(getFiltered()));
  });

  // Bind dice spin on MORE button
  const diceIcon = document.getElementById('diceIcon');
  document.getElementById('moreBtn').addEventListener('click', () => {
    diceIcon.classList.remove('spinning');
    void diceIcon.offsetWidth;
    diceIcon.classList.add('spinning');
    setTimeout(() => diceIcon.classList.remove('spinning'), 700);
  });

  // Bind search
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');

  searchInput.addEventListener('input', () => {
    searchClear.classList.toggle('visible', searchInput.value.length > 0);
    runSearch(searchInput, searchClear);
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.classList.remove('visible');
    runSearch(searchInput, searchClear);
  });

  // Spice sliders
  updateSpiceFill();
  document.getElementById('spiceMin').addEventListener('input', function() {
    spiceLo = parseInt(this.value);
    if (spiceLo > spiceHi) { spiceLo = spiceHi; this.value = spiceLo; }
    updateSpiceFill();
  });
  document.getElementById('spiceMax').addEventListener('input', function() {
    spiceHi = parseInt(this.value);
    if (spiceHi < spiceLo) { spiceHi = spiceLo; this.value = spiceHi; }
    updateSpiceFill();
  });

  // Close dropdowns on outside click
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.custom-select')) closeAllDropdowns();
  });
}

// ── Dropdown helpers ──────────────────────────────────────
function buildDropdown(panelId, items, selectedSet, previewId, countsObj) {
  const panel = document.getElementById(panelId);
  panel.innerHTML = '';

  const ctrlRow = document.createElement('div');
  ctrlRow.className = 'dropdown-ctrl';

  const selectAllBtn = document.createElement('button');
  selectAllBtn.className = 'dropdown-ctrl-btn';
  selectAllBtn.textContent = 'Select All';
  selectAllBtn.addEventListener('mousedown', (e) => {
    e.preventDefault(); e.stopPropagation();
    items.forEach(item => selectedSet.add(item));
    buildDropdown(panelId, items, selectedSet, previewId, countsObj);
    updatePreview(previewId, selectedSet, items);
  });

  const deselectAllBtn = document.createElement('button');
  deselectAllBtn.className = 'dropdown-ctrl-btn';
  deselectAllBtn.textContent = 'Deselect All';
  deselectAllBtn.addEventListener('mousedown', (e) => {
    e.preventDefault(); e.stopPropagation();
    const first = items[0];
    selectedSet.clear();
    if (first) selectedSet.add(first);
    buildDropdown(panelId, items, selectedSet, previewId, countsObj);
    updatePreview(previewId, selectedSet, items);
  });

  ctrlRow.appendChild(selectAllBtn);
  ctrlRow.appendChild(deselectAllBtn);
  panel.appendChild(ctrlRow);

  items.forEach(item => {
    const opt = document.createElement('div');
    const isSelected = selectedSet.has(item);
    opt.className = 'dropdown-option' + (isSelected ? ' selected' : '');

    const checkbox = document.createElement('div');
    checkbox.className = 'checkbox';
    checkbox.innerHTML = isSelected ? '&#10003;' : '';

    const label = document.createElement('span');
    label.textContent = item;

    opt.appendChild(checkbox);
    opt.appendChild(label);

    if (countsObj) {
      const countBadge = document.createElement('span');
      countBadge.className = 'option-count';
      countBadge.textContent = countsObj[item] !== undefined ? countsObj[item] : '';
      opt.appendChild(countBadge);
    }

    opt.addEventListener('mousedown', (e) => {
      e.preventDefault(); e.stopPropagation();
      if (selectedSet.has(item)) {
        if (selectedSet.size > 1) selectedSet.delete(item);
      } else {
        selectedSet.add(item);
      }
      buildDropdown(panelId, items, selectedSet, previewId, countsObj);
      updatePreview(previewId, selectedSet, items);
    });

    panel.appendChild(opt);
  });
}

function updatePreview(previewId, selectedSet, allItems) {
  const el = document.getElementById(previewId);
  if (selectedSet.size === allItems.length) {
    el.textContent = 'All ' + (previewId === 'catPreview' ? 'categories' : 'settings');
  } else if (selectedSet.size === 1) {
    el.textContent = [...selectedSet][0];
  } else {
    el.textContent = [...selectedSet].join(', ');
  }
}

function openPanel(key) {
  document.getElementById(key === 'cat' ? 'catPanel' : 'setPanel').classList.add('open');
  document.getElementById(key === 'cat' ? 'catTrigger' : 'setTrigger').classList.add('open');
  openDropdown = key;
}
function closePanel(key) {
  document.getElementById(key === 'cat' ? 'catPanel' : 'setPanel').classList.remove('open');
  document.getElementById(key === 'cat' ? 'catTrigger' : 'setTrigger').classList.remove('open');
  if (openDropdown === key) openDropdown = null;
}
function closeAllDropdowns() { closePanel('cat'); closePanel('set'); }
function setupTrigger(key) {
  document.getElementById(key === 'cat' ? 'catTrigger' : 'setTrigger').addEventListener('click', (e) => {
    e.stopPropagation();
    openDropdown === key ? closePanel(key) : (closeAllDropdowns(), openPanel(key));
  });
}

// ── Filtering & rendering ─────────────────────────────────
function getFiltered() {
  return DATA.filter(d =>
    selectedCats.has(d.category) &&
    selectedSets.has(d.setting) &&
    d.spice >= spiceLo && d.spice <= spiceHi
  );
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateSpiceFill() {
  const pct = v => ((v + 5) / 10) * 100;
  const fill = document.getElementById('spiceFill');
  fill.style.left  = pct(spiceLo) + '%';
  fill.style.width = (pct(spiceHi) - pct(spiceLo)) + '%';
  const loNeg = spiceLo < 0, hiPos = spiceHi > 0;
  if (loNeg && hiPos)    fill.style.background = 'linear-gradient(to right,#5bc4f0,#888,#ff2d78)';
  else if (loNeg)        fill.style.background = '#5bc4f0';
  else if (hiPos)        fill.style.background = '#ff2d78';
  else                   fill.style.background = '#888';
  const fmt = v => v >= 0 ? '+' + v : '' + v;
  document.getElementById('spiceMinLabel').textContent = fmt(spiceLo);
  document.getElementById('spiceMaxLabel').textContent = fmt(spiceHi);
}

function makeSpiceTag(spice) {
  const tag = document.createElement('span');
  tag.className = 'tag tag-spice';
  if (spice > 0) {
    tag.textContent = '🌶 +' + spice;
    tag.style.cssText = 'background:rgba(255,45,120,0.15);border:1px solid rgba(255,45,120,0.35);color:#ff2d78;';
  } else if (spice < 0) {
    tag.textContent = '🧊 ' + spice;
    tag.style.cssText = 'background:rgba(91,196,240,0.15);border:1px solid rgba(91,196,240,0.35);color:#5bc4f0;';
  } else {
    tag.textContent = '— 0';
    tag.style.cssText = 'background:rgba(136,136,136,0.12);border:1px solid rgba(136,136,136,0.25);color:#888;';
  }
  return tag;
}

function isPinned(item) { return pinnedItems.includes(item); }

function togglePin(item, cardEl, pinBtn) {
  if (isPinned(item)) {
    pinnedItems = pinnedItems.filter(p => p !== item);
    cardEl.classList.remove('pinned');
  } else {
    pinnedItems.push(item);
    cardEl.classList.add('pinned');
  }
  pinBtn.classList.remove('pop');
  void pinBtn.offsetWidth;
  pinBtn.classList.add('pop');
}

function makeCard(item) {
  const card = document.createElement('div');
  card.className = 'card cat-' + item.category.toLowerCase();
  if (isPinned(item)) card.classList.add('pinned');

  const pinBtn = document.createElement('button');
  pinBtn.className = 'pin-btn';
  pinBtn.title = 'Pin this card';
  pinBtn.innerHTML = '⭐';
  pinBtn.setAttribute('aria-label', 'Pin card');

  card.innerHTML =
    '<div class="card-meta">' +
      '<span class="tag tag-category">' + item.category + '</span>' +
      '<span class="tag tag-setting">' + item.setting + '</span>' +
    '</div>' +
    '<div class="card-text">' + item.text + '</div>';

  const meta = card.querySelector('.card-meta');
  meta.insertBefore(makeSpiceTag(item.spice), meta.children[2] || null);
  meta.appendChild(pinBtn);

  pinBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    togglePin(item, card, pinBtn);
  });
  card.addEventListener('click', (e) => {
    if (e.target === pinBtn) return;
    togglePin(item, card, pinBtn);
  });

  return card;
}

function renderCards(newItems) {
  const area = document.getElementById('cardsArea');
  area.innerHTML = '';

  const slotsForNew = Math.max(0, cardCount - pinnedItems.length);
  const freshPool   = newItems.filter(item => !isPinned(item));
  const freshItems  = freshPool.slice(0, slotsForNew);
  const toShow      = [...pinnedItems, ...freshItems];

  if (!toShow.length) {
    area.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9672;</div><p>No matches for this filter combo</p></div>';
    return;
  }
  toShow.forEach(item => area.appendChild(makeCard(item)));
}

function runSearch(searchInput, searchClear) {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    if (!searchMode) return;
    document.getElementById('cardsArea').innerHTML =
      '<div class="empty-state"><div class="empty-icon">&#9672;</div><p>Hit MORE to deal your cards</p></div>';
    return;
  }
  searchMode = true;
  pinnedItems = [];
  const results = DATA.filter(d => d.text.toLowerCase().includes(q));
  const area = document.getElementById('cardsArea');
  area.innerHTML = '';
  if (!results.length) {
    area.innerHTML = '<div class="empty-state"><div class="empty-icon">&#9672;</div><p>No cards match that search</p></div>';
    return;
  }
  results.forEach(item => area.appendChild(makeCard(item)));
}

function openExternalLink(url) {
  window.open(url, '_blank');
}
</script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").then(reg => {
        console.log("SW registered:", reg);
      }).catch(err => {
        console.log("SW failed:", err);
      });
    });
  }
</script>

</body>
</html>
